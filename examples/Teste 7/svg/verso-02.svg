nt-size="3.6" font-weight="700" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Água Micelar</tspan></text><text id="SOURCE__v02-a0" x="50.001" y="47.979" font-family="MzM" font-size="2.9" font-weight="500" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Com ácido hialurônico,</tspan><tspan x="50.001" dy="3.45">niacinamida e prebióticos</tspan></text><text id="SOURCE__v02-d0" x="89.002" y="43.679" font-family="MzM" font-size="2.9" font-weight="400" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="89.002" dy="0">Demaquilante com ação 4 em 1:</tspan><tspan x="89.002" dy="3.45">limpa, demaquila, purifica e hidrata.</tspan><tspan x="89.002" dy="3.45">Protege contra a poluição e</tspan><tspan x="89.002" dy="3.45">proporciona uma pele reequilibrada e</tspan><tspan x="89.002" dy="3.45">saudável.</tspan></text><text id="SOURCE__v02-n1" x="50.001" y="63.953" font-family="MzM" font-size="3.6" font-weight="700" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Gel de Limpeza</tspan></text><text id="SOURCE__v02-a1" x="50.001" y="67.979" font-family="MzM" font-size="2.9" font-weight="500" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Com niacinamida, prebiótico</tspan><tspan x="50.001" dy="3.45">e PCA-zinco</tspan></text><text id="SOURCE__v02-d1" x="89.002" y="63.679" font-family="MzM" font-size="2.9" font-weight="400" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="89.002" dy="0">Fortalece a barreira natural da pele e</tspan><tspan x="89.002" dy="3.45">proporciona uma pele livre de</tspan><tspan x="89.002" dy="3.45">oleosidade, hidratada e saudável.</tspan></text><text id="SOURCE__v02-n2" x="50.001" y="80.954" font-family="MzM" font-size="3.6" font-weight="700" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Espu