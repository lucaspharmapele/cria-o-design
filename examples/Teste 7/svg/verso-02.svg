os</tspan><tspan x="89.002" dy="3.45">poros sem agredir a pele.</tspan></text><text id="SOURCE__v02-s03" x="12" y="128.562" font-family="MzH" font-size="8" font-weight="900" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="12" dy="0">03</tspan></text><text id="SOURCE__v02-l03" x="12" y="133.955" font-family="MzH" font-size="3.6" font-weight="900" letter-spacing="0.3" text-anchor="start" fill="#005095" opacity="1"><tspan x="12" dy="0">TONIFICAR</tspan></text><text id="SOURCE__v02-n4" x="50.001" y="124.954" font-family="MzM" font-size="3.6" font-weight="700" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Tônico Nutritivo</tspan></text><text id="SOURCE__v02-a4" x="50.001" y="128.98" font-family="MzM" font-size="2.9" font-weight="500" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="50.001" dy="0">Com ác. hialurônico,</tspan><tspan x="50.001" dy="3.45">niacinamida, aminoácidos e</tspan><tspan x="50.001" dy="3.45">simbióticos</tspan></text><text id="SOURCE__v02-d4" x="89.002" y="124.68" font-family="MzM" font-size="2.9" font-weight="400" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="89.002" dy="0">Retrai os poros dilatados, finaliza a</tspan><tspan x="89.002" dy="3.45">limpeza facial com agradável</tspan><tspan x="89.002" dy="3.45">sensação de maciez e prepara a pele</tspan><tspan x="89.002" dy="3.45">para um tratamento profundo.</tspan></text><text id="SOURCE__v02-s04" x="12" y="152.563" font-family="MzH" font-size="8" font-weight="900" letter-spacing="0" text-anchor="start" fill="#005095" opacity="1"><tspan x="12" dy="0">04</tspan></text><text id="SOURCE__v02-l04" x="12" y="157.955" font-family="MzH" font-size="3.6" font-weight="900" letter-spacing="0.3" text-anchor="start" fill="#005095" opacity="1"><tspan x="12" dy="0">HIDRATAR</tspan></text><text id="SOURCE__v02-n5" x="50.001" y="148.955" font-family="MzM" font-size="3.6" font-weight="700" 