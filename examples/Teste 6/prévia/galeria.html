<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Teste 6 — Galeria</title><style>body{margin:0;padding:32px;background:#e7ecef;font-family:Arial,sans-serif;color:#102a3a}h1{margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(360px,1fr));gap:28px}.card{background:#fff;padding:16px}.card h2{margin:0 0 12px;font-size:16px}.card iframe{display:block;width:100%;height:820px;border:0;background:#e7ecef}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Teste 6 — 5 frentes e 5 versos</h1><div class="grid"><script>for(const side of ['frente','verso'])for(let i=1;i<=5;i++){const n=String(i).padStart(2,'0');document.write(`<section class="card"><h2>${side} ${n}</h2><iframe src="${side}-${n}.html"></iframe></section>`)}</script></div></body></html>
